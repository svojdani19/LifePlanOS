# Quality gate: lint, types, tests, migrations, production build.
#
# Deliberately NON-DEPLOYING and PHI-free. It never touches a production
# database, never needs a real DATABASE_URL, and never handles patient data.
#
# That is possible because every test in the suite mocks Prisma — verified by
# running the full 2,880-test suite against an unroutable DATABASE_URL, which
# passes. The URL below exists only to satisfy Prisma's client construction; no
# connection is ever opened.
#
# Migrations are validated statically — see the step comment for why a live
# `migrate deploy` is not yet the gate, and what has to be repaired first.
name: quality

on:
  push:
    branches: [main]
  pull_request:

# Read-only: the workflow can never push, tag, or deploy.
permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # NOT a secret and NOT a real database — an unroutable placeholder.
      # Prisma constructs its client from this; nothing opens a connection.
      # Verified by running the full suite locally against exactly this value.
      DATABASE_URL: postgresql://nobody@127.0.0.1:1/none
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        run: npx next lint --max-warnings=0

      - name: Tests
        run: npx vitest run --reporter=dot

      # `prisma migrate deploy` against an empty database is the check we WANT
      # here, and it would fail today for a reason that predates this workflow:
      # the dev database was built with `db push`, so two tables
      # (VocationalEntry, EconomicScenario) are ALTERed by migrations that never
      # create them. Shipping a step that is red from day one teaches everyone
      # to ignore CI.
      #
      # So this checks the property statically instead: it FAILS on any NEW
      # table with that defect, and records the two known ones. When those are
      # repaired, swap this for `prisma migrate deploy` against a throwaway
      # Postgres service container.
      - name: Migration history can rebuild from nothing
        run: npx tsx scripts/check-migration-history.ts

      - name: Production build
        run: npx next build
