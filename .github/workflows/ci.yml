name: CI

on:
  push:
  pull_request:

env:
  DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/lifeplanos_ci?schema=public"
  DIRECT_URL: "postgresql://ci:ci@127.0.0.1:5432/lifeplanos_ci?schema=public"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: lifeplanos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d lifeplanos_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Prisma schema validate
        run: npx prisma validate
      - name: Prisma client generate
        run: npx prisma generate
      - name: Apply migrations to clean PostgreSQL
        run: npx prisma migrate deploy
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint
        # `next lint` passes repo-wide today (warnings only, exit 0). If legacy
        # warnings ever get promoted to errors, scope this to the hardened
        # modules: npx eslint src/lib/authz src/lib/engagements src/lib/demo
        # src/lib/engine --max-warnings 0
        run: npm run lint
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high --omit=dev
