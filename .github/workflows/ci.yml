name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No live database is required anywhere in CI (verified locally): the test
# suite is pure (no DB/network), and `next build` succeeds with an unreachable
# DATABASE_URL because every DB-touching page is dynamic (ƒ) — only /login,
# /signup, and static shells are prerendered. Prisma validate/generate and the
# startup env check only need the vars to be PRESENT, so dummies suffice.
env:
  DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/ci"
  DIRECT_URL: "postgresql://ci:ci@127.0.0.1:5432/ci"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Prisma schema validate
        run: npx prisma validate
      - name: Prisma client generate
        run: npx prisma generate
      - name: Type-check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npm run build
